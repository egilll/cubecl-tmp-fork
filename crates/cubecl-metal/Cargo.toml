[package]
authors = ["dcvz <david@dcvz.io>"]
categories = ["science"]
description = "Metal runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "metal"]
license.workspace = true
name = "cubecl-metal"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-metal"
version.workspace = true

[features]
default = ["std"]
pliron-dump = ["cubecl-cpp/pliron-dump"]
persistence = ["cubecl-server/persistence"]
# A kernel whose name contains `inject_execution_fault` makes its command
# buffer report an execution fault: for fault drills, never for releases.
fault-injection = []
# Run on the Metal device behind a wgpu device, and hand leased buffers to it.
wgpu = ["dep:wgpu", "dep:wgpu-hal"]
std = [
    "cubecl-server/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-cpp/std",
]

[dependencies]
cubecl-common = { path = "../cubecl-common", version = "=0.11.0-pre.4", default-features = false }
cubecl-environment = { path = "../cubecl-environment", version = "=0.11.0-pre.4", default-features = false }
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.4", default-features = false }
cubecl-ir = { path = "../cubecl-ir", version = "=0.11.0-pre.4", default-features = false }
cubecl-monitoring = { path = "../cubecl-monitoring", version = "=0.11.0-pre.4", default-features = false, features = [
    "io-accelerator",
] }
cubecl-server = { path = "../cubecl-server", version = "=0.11.0-pre.4", default-features = false }
cubecl-cpp = { path = "../cubecl-cpp", version = "=0.11.0-pre.4", features = ["metal"] }

# Utilities
log = { workspace = true }
derive-new = { workspace = true }
hashbrown = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
serde = { workspace = true }

# Metal bindings only exist on Apple platforms. Keeping them in a target table
# means other platforms never even download them, so workspace-wide builds and
# clippy work everywhere (the crate itself is empty off-Apple, see lib.rs).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["block2", "MTLLibrary", "objc2-core-foundation"] }
objc2-foundation = "0.3"
block2 = "0.6"
wgpu = { workspace = true, optional = true, features = ["metal"] }
wgpu-hal = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.4", features = ["export_tests"] }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.4", features = ["export_tests"] }
cubecl-algorithms = { path = "../cubecl-algorithms", features = ["export_tests"] }
test-log = { workspace = true, features = ["trace"] }
paste = { workspace = true }

[lints]
workspace = true
